# SearXNG — the open-web search backend.
#
# Running it in the cluster rather than as a standalone Docker host is the
# recommendation: it is an internal dependency of one application, it holds no
# state worth keeping, and in here it gets a ClusterIP with no Ingress, so it is
# reachable by the backend and by nothing else. A separate Docker host would be
# another machine to patch and another thing to firewall, for no gain.
#
# Deliberately not exposed through the ingress. An open SearXNG instance is an
# open proxy: anyone who can reach it can make this network issue arbitrary
# outbound search requests.
#
# Apply into the same namespace as the app:
#   kubectl -n mike-uat apply -f k8s/searxng/searxng.yaml
# then point the app at it in the Secret:
#   SEARXNG_BASE_URL=http://searxng:8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: "Mike search"
      # No public instance list, no metrics endpoint.
      donation_url: false
      contact_url: false
    server:
      bind_address: "0.0.0.0"
      port: 8080
      # Overridden by the SEARXNG_SECRET env var below; a value has to be
      # present here for the file to parse.
      secret_key: "set-via-env"
      limiter: false
      image_proxy: false
    search:
      # THE ONE LINE THAT MATTERS. A default install serves HTML only, and the
      # app's every search comes back 403 with no other explanation. lib/
      # webSearch.ts turns that status into a message naming this setting,
      # because the bare 403 tells an operator nothing.
      formats:
        - html
        - json
      safe_search: 0
      autocomplete: ""
    ui:
      static_use_hash: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
            # Session signing key. Generate with `openssl rand -hex 32` and put
            # it in its own Secret; it is not shared with the app.
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
