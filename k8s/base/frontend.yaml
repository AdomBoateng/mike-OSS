apiVersion: apps/v1
kind: Deployment
metadata:
  name: mike-frontend
  labels:
    app.kubernetes.io/name: mike
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mike
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mike
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: frontend
          # Replaced per environment by CI (kustomize edit set image).
          image: mike-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            # Read at REQUEST time by app/env.js/route.ts and handed to the
            # browser. This is why UAT and production can be the same image:
            # a NEXT_PUBLIC_* value would have been inlined at build time.
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: mike-config
                  key: API_BASE_URL
          # "/" redirects depending on auth state, so probe a page that is
          # always rendered and needs neither a session nor the backend.
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mike-frontend
  labels:
    app.kubernetes.io/name: mike
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mike
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
