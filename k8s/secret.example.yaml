# TEMPLATE ONLY — do not fill this in and commit it.
#
# The intended way to create the real Secret is straight from the .env file the
# environment already needs, so there is one list of variables rather than two
# that drift:
#
#   kubectl -n mike-uat create secret generic mike-secrets \
#     --from-env-file=backend/.env.uat
#
# `backend/.env.example` is the authoritative reference for what each of these
# means; this file is a checklist of which of them are SECRET, and therefore
# belong here rather than in k8s/base/configmap.yaml.
#
# If the cluster has SealedSecrets or External Secrets, use it — an encrypted
# SealedSecret can live in this repo, a plain Secret cannot.
#
# Rotation notes worth knowing before you generate these:
#   - SESSION_JWT_SECRET             rotating it signs everyone out
#   - USER_API_KEYS_ENCRYPTION_SECRET rotating it makes stored API keys and
#                                     enrolled authenticators permanently
#                                     unreadable — MFA has to be re-enrolled
#   - DOWNLOAD_SIGNING_SECRET        rotating it breaks every download link ever
#                                     put in a chat transcript, because those
#                                     tokens do not expire
#
# UAT and production must NOT share any of these values. In particular a shared
# SESSION_JWT_SECRET means a UAT session token is accepted by production.
apiVersion: v1
kind: Secret
metadata:
  name: mike-secrets
type: Opaque
stringData:
  # --- generate each separately: openssl rand -hex 32 ---
  SESSION_JWT_SECRET: "CHANGE-ME"
  DOWNLOAD_SIGNING_SECRET: "CHANGE-ME"
  USER_API_KEYS_ENCRYPTION_SECRET: "CHANGE-ME"

  # --- your Postgres ---
  DATABASE_URL: "postgres://mike:CHANGE-ME@postgres.internal:5432/mike"

  # --- directory ---
  LDAP_URL: "ldap://ldap.internal:389"
  LDAP_SEARCH_BIND_DN: "uid=serviceaccount,cn=users,cn=accounts,dc=example,dc=com"
  LDAP_SEARCH_BIND_PASSWORD: "CHANGE-ME"
  LDAP_USER_BASE_DN: "cn=users,cn=accounts,dc=example,dc=com"

  # --- surf / S3-compatible object storage ---
  S3_ENDPOINT_URL: "https://s3.internal"
  S3_ACCESS_KEY_ID: "CHANGE-ME"
  S3_SECRET_ACCESS_KEY: "CHANGE-ME"
  # Use a DIFFERENT bucket for UAT than for production. They share nothing
  # otherwise, and a UAT test that deletes a document should not be able to
  # reach a real one.
  S3_BUCKET_NAME: "mike-uat"

  # --- the model endpoint ---
  CUSTOM_LLM_BASE_URL: "http://vllm.internal:8000/v1"
  CUSTOM_LLM_API_KEY: "CHANGE-ME"

  # --- outbound mail (optional; sharing works without it, invitations don't) ---
  SMTP_HOST: "mail.internal"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "no-reply@example.com"
  SMTP_PASS: "CHANGE-ME"
  SMTP_FROM: "Mike <no-reply@example.com>"

  # Note: SEARXNG_BASE_URL is NOT here. A Service address inside the cluster is
  # not a secret, so it lives in k8s/base/configmap.yaml.
